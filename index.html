<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Portfolio</title>
        <meta name="description" content="Web・データ・動画の作品をまとめたポートフォリオ">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>
        <header class="site-header">
            <div class="wrapper header-inner">
                <a href="index.html" class="pill logo">Omochi</a>

                <nav aria-label="メインメニュー">
                <ul class="nav">
                    <li><a class="nav-link" href="#web">Web</a></li>
                    <li><a class="nav-link" href="#data">Data</a></li>
                    <li><a class="nav-link" href="#movie">Movie</a></li>
                    <li><a class="nav-link" href="#about">About</a></li>
                    <li><a class="pill pill--contact" href="#contact">Contact</a></li>
                </ul>
                </nav>
            </div>
        </header>

        <main>
            <section class="wrapper hero">
                <div class="hero-text">
                    <h1 class="catch">
                        <span class="box box--web">つくって、</span>
                        <span class="box box--data">しらべて、</span>
                        <span class="box box--movie">みせる。</span>
                    </h1>
                    <p>コーディングの練習で作ったWebサイト、データ分析の練習、動画編集やモーショングラフィックをまとめています。</p>
                    <ul class="hero-buttons">
                        <li><a class="pill pill--watch" href="#web">作品を見る</a></li>
                        <li><a class="pill pill--contact" href="#contact">お問い合わせ</a></li>
                    </ul>
                </div>

                <div class="hero-visual">
                    <!-- ① ブラウザの窓 -->
                    <div class="window">
                        <div class="window-bar">
                            <span class="dot"></span>
                            <span class="dot"></span>
                            <span class="dot"></span>
                        </div>
                        <div class="window-body">
                            <div class="line line--accent"></div>
                            <div class="line"></div>
                            <div class="line line--short"></div>
                            <div class="blocks">
                                <span class="block block--mint"></span>
                                <span class="block block--lavender"></span>
                                <span class="block block--yellow"></span>
                            </div>
                        </div>
                    </div>

                    <!-- ② と ③ のタイルを横に並べる -->
                    <div class="tiles">
                        <div class="tile tile--chart">
                            <span class="bar" style="height: 30%"></span>
                            <span class="bar" style="height: 50%"></span>
                            <span class="bar" style="height: 40%"></span>
                            <span class="bar bar--accent" style="height: 70%"></span>
                        </div>
                        <div class="tile tile--video">
                            <span class="play">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
                            </span>
                        </div>
                    </div>
                </div>
            </section>

            <section id="web"><!-- Web制作 --></section>
            <section id="data"><!-- データ分析 --></section>
            <section id="movie"><!-- 動画 --></section>
        </main>

        <footer>
            <!-- コピーライト -->
        </footer>

        <script src="js/main.js"></script>
    </body>
</html>
